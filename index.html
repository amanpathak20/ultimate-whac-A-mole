<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ultimate Whac-A-Mole</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #fffbe0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .status, .scoreboard {
      font-size: 1.4rem;
      margin: 0.5rem 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
    }

    .hole {
      position: relative;
      background: #a0522d;
      border-radius: 50%;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1 / 1;
      box-shadow: inset 0 8px 10px rgba(0,0,0,0.3);
    }

    .mole {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 80%;
      background: #4caf50;
      border: 3px solid #2e7d32;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      touch-action: manipulation;
    }

    .mole.up {
      opacity: 1;
    }

    .mole.clicked {
      background: #1976d2;
      cursor: default;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.8rem 1.5rem;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      background-color: #ff7f50;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #e0673f;
    }
  </style>
</head>
<body>

  <h1>🎯 Ultimate Whac-A-Mole</h1>
  <div class="status">⏱ Time Left: <span id="time">30</span>s</div>
  <div class="scoreboard">
    🧠 Score: <span id="score">0</span> |
    🏆 High Score: <span id="highscore">0</span>
  </div>
  <div class="grid" id="grid"></div>
  <button onclick="startGame()">Start / Restart Game</button>

  <!-- Sound effects -->
  <audio id="clickSound" src="https://www.myinstants.com/media/sounds/mixkit-game-ball-tap-2073.wav"></audio>
  <audio id="endSound" src="https://www.myinstants.com/media/sounds/fail-trombone-01.mp3"></audio>

  <script>
    const grid = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const highscoreEl = document.getElementById('highscore');
    const clickSound = document.getElementById('clickSound');
    const endSound = document.getElementById('endSound');

    let score = 0;
    let highscore = 0;
    let gameRunning = false;
    let countdown;

    // Create grid
    for (let i = 0; i < 9; i++) {
      const hole = document.createElement('div');
      hole.classList.add('hole');

      const mole = document.createElement('div');
      mole.classList.add('mole');
      mole.dataset.index = i;

      mole.addEventListener('click', handleClick);
      mole.addEventListener('touchstart', handleClick);

      hole.appendChild(mole);
      grid.appendChild(hole);
    }

    const moles = document.querySelectorAll('.mole');

    function handleClick(e) {
      const mole = e.currentTarget;
      if (!gameRunning || mole.classList.contains('clicked')) return;

      mole.classList.add('clicked');
      score++;
      scoreEl.textContent = score;
      clickSound.currentTime = 0;
      clickSound.play();
      showRandomMole();
    }

    function resetMoles() {
      moles.forEach(m => {
        m.classList.remove('up', 'clicked');
      });
    }

    function showRandomMole() {
      resetMoles();
      const available = Array.from(moles).filter(m => !m.classList.contains('clicked'));
      if (available.length === 0) return;
      const randomIndex = Math.floor(Math.random() * available.length);
      available[randomIndex].classList.add('up');
    }

    function startGame() {
      clearInterval(countdown);
      score = 0;
      scoreEl.textContent = score;
      gameRunning = true;
      let timeLeft = 30;
      timeEl.textContent = timeLeft;
      resetMoles();
      showRandomMole();

      countdown = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          gameRunning = false;
          resetMoles();
          if (score > highscore) {
            highscore = score;
            highscoreEl.textContent = highscore;
          }
          endSound.play();
          setTimeout(() => {
            alert("⏰ Time's up! Your final score: " + score);
          }, 100);
        }
      }, 1000);
    }
  </script>
</body>
</html>
